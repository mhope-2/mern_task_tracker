name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly audit, so new advisories against the current lockfile show up
    # even when no PR is open.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API dependency and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The API has no test suite yet. Validate every JavaScript file and
      # check that the dependency modules load, so dependency PRs still have
      # a meaningful automated gate.
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -path './node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Load modules
        run: |
          node -e "for (const m of ['express','mongoose','multer','morgan','admin-bro','@admin-bro/express','@admin-bro/mongoose','./routes/task.route']) require(m)"

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
